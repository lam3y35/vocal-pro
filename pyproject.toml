[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vocalpro"
version = "2.5.0"
description = "Audio separation tool for vocal/background music removal"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "demucs>=4.0.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "noisereduce>=3.0.0",
    "customtkinter",
    "sounddevice>=0.5.0",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["code*"]

[tool.pytest.ini_options]
testpaths = ["code/test_all.py"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
