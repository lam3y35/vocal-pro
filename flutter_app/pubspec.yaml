publish_to: 'none'
version: 2.5.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  web_socket_channel: ^2.4.0
  file_picker: ^8.0.0
  path: ^1.9.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  desktop_drop: ^0.4.4
  ffi: ^2.0.0
  win32: ^5.0.0
  tray_manager: ^0.5.3
  audioplayers: ^6.8.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

