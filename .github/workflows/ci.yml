name: VocalPro v3 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  worker-and-dsp-golden-tests:
    name: Python Worker & Golden Null-Test Suite (40 Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Legacy vocal-pro Reference Repo for Golden Null-Tests
        run: git clone --depth 1 https://github.com/lam3y35/vocal-pro.git ../vocal-pro
      - name: Install FFmpeg & libsndfile
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Worker Dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch torchaudio demucs numpy scipy soundfile librosa resampy noisereduce pytest jsonschema
      - name: Generate Reference Set, Golden Baseline & Run Worker + Regression Suite (P-01..P-19)
        run: |
          python benchmarks/generate_reference_set.py
          python benchmarks/run_old_engine.py
          PYTHONPATH=worker pytest worker/tests -v

  rust-core-tests:
    name: Rust Core (Symphonia, Streaming Mixer, SQLite Migration, Hardware, Queue)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy & soundfile for reference audio generation
        run: pip install numpy soundfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting & Clippy
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Run Cross-Platform Rust Integration Tests
        run: |
          python benchmarks/generate_reference_set.py
          cargo test --manifest-path src-tauri/Cargo.toml --test integration_tests -- test_legacy_migration_imports_all_files_and_deduplicates_outputs
          cargo test --manifest-path src-tauri/Cargo.toml --test integration_tests -- test_native_symphonia_waveform_under_300ms_and_live_stem_mixer
          cargo test --manifest-path src-tauri/Cargo.toml --test integration_tests -- test_streaming_mixer_6_stems_5_minutes_under_150mb_rss
          cargo test --manifest-path src-tauri/Cargo.toml --test integration_tests -- test_hardware_detection_all_6_tiers_battery_and_non_cuda_gpu
          cargo test --manifest-path src-tauri/Cargo.toml --test integration_tests -- test_settings_persistence_per_key_reset_and_json_import_export
          cargo test --manifest-path src-tauri/Cargo.toml --test integration_tests -- test_queue_priority_reorder_pause_resume_and_sqlite_persistence

  frontend-typecheck-and-build:
    name: React 19 + TypeScript Strict Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & Build Frontend
        run: |
          npm install
          npm run typecheck
          npm run build
